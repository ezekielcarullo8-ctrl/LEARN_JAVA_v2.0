name: Build JavaLab APK

# Repo layout:  index.html  (+ optional assets/icon-only.png, 1024x1024)
# Path:         .github/workflows/build-apk.yml
on:
  push:
    branches: [main, master]
    paths:
      - "index.html"
      - "*.png"
      - "*.webp"
      - "site.webmanifest"
      - "assets/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BRAND_COLOR: "#05060e"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      # 1. Copy the web app. JavaLab is fully self-contained, so it works offline.
      - name: Prepare web app
        run: |
          set -e
          test -f index.html || { echo "::error::index.html not found in repo root"; exit 1; }
          if grep -nE 'https?://(cdn|unpkg|fonts)' index.html; then
            echo "::warning::index.html references online resources; the app will not be fully offline"
          fi
          mkdir -p www
          cp index.html www/index.html
          # Keep the app fully offline: bundle every local image and manifest
          # referenced by index.html, including the separate screen artwork.
          for asset in *.png *.webp site.webmanifest; do
            [ -f "$asset" ] && cp "$asset" www/
          done

      # 2. Wrap in an Android project (Capacitor 6).
      #    @capacitor/app is REQUIRED: it powers the phone back button and exit.
      - name: Install Capacitor
        run: |
          set -e
          npm init -y >/dev/null
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 @capacitor/assets@3

      - name: Create Android project
        run: |
          set -e
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.evc.learnjava",
            "appName": "JavaLab",
            "webDir": "www",
            "backgroundColor": "#05060e",
            "server": { "androidScheme": "https" }
          }
          JSON
          npx cap add android

      # 3. Optional icon + splash (skipped if no icon is provided)
      - name: Generate icon and splash
        run: |
          set -e
          if [ -s assets/icon-only.png ] || [ -s assets/icon.png ]; then
            npx capacitor-assets generate --android --assetPath assets \
              --iconBackgroundColor "$BRAND_COLOR" --iconBackgroundColorDark "$BRAND_COLOR" \
              --splashBackgroundColor "$BRAND_COLOR" --splashBackgroundColorDark "$BRAND_COLOR"
          else
            echo "No assets/icon-only.png found, using the default Capacitor icon."
          fi

      - name: Sync web assets and plugins
        run: |
          set -e
          npx cap sync android
          grep -q "capacitor-app" android/capacitor.settings.gradle || { echo "::error::Back-button plugin (@capacitor/app) was not added"; exit 1; }

      - name: Patch Android project
        run: |
          set -e
          # dark status/navigation bars to match the app
          S=android/app/src/main/res/values/styles.xml
          sed -i '/<style name="AppTheme.NoActionBar"/a\        <item name="android:statusBarColor">#05060E</item>\n        <item name="android:navigationBarColor">#05060E</item>\n        <item name="android:windowLightStatusBar">false</item>' "$S"
          # higher versionCode on every build so updates install over the old app
          G=android/app/build.gradle
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" "$G"
          grep -n "versionCode\|versionName" "$G"

      # 4. Stable signing key, so new builds install OVER the old app and keep
      #    your saved progress. Without it Android says "App not installed".
      #    One-time setup, on your computer:
      #      keytool -genkey -v -keystore debug.keystore -storepass android -keypass android \
      #        -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=JavaLab"
      #      base64 -w0 debug.keystore      (macOS: base64 -i debug.keystore)
      #    Paste the output into a repo secret named KEYSTORE_BASE64
      #    (Settings > Secrets and variables > Actions).
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Using the stable key from the KEYSTORE_BASE64 secret."
          else
            echo "::warning::No KEYSTORE_BASE64 secret. A temporary key is used, so updates may need an uninstall first (this erases saved progress)."
          fi

      # 5. Build
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Check and rename APK
        run: |
          set -e
          test -f android/app/build/outputs/apk/debug/app-debug.apk || { echo "::error::APK was not produced"; exit 1; }
          cp android/app/build/outputs/apk/debug/app-debug.apk learnjava.apk
          ls -la learnjava.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnjava-apk
          path: learnjava.apk

      - name: Publish Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: LearnJava APK #${{ github.run_number }}
          files: learnjava.apk
